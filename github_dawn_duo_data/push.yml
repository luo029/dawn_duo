name: Send Scheduled Web Push

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '是否为手动测试 (跳过防误触)'
        required: false
        default: 'false'
      trigger_from:
        description: '触发来源 (partner = 打卡触发)'
        required: false
        default: ''

jobs:
  send-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web-push
        run: npm install web-push
      - name: Send push notifications
        run: node send-push.js
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          TRIGGER_FROM: ${{ github.event.inputs.trigger_from }}
      
      - name: Commit and push cleaned subscriptions (if any expired)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s subscriptions.json) ]]; then
            git add subscriptions.json
            git commit -m "chore: cleanup expired subscriptions"
            git push
          fi